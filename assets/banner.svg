<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b132b"/><stop offset="50%" stop-color="#1c2541"/><stop offset="100%" stop-color="#0a192f"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7928ca"/><stop offset="100%" stop-color="#ff0080"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.25}}@keyframes float1{0%{transform:translate(0,0)}}@keyframes float2{0%{transform:translate(0,0)}}@keyframes float3{0%{transform:translate(0,0)}}@keyframes rotateRing{0%{transform:rotate(0deg)}}@keyframes badgePulse{0%{opacity:.7}}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate}.wave-line{animation:wave 8s ease-in-out infinite alternate}.float-node-1{animation:float1 6s ease-in-out infinite alternate}.float-node-2{animation:float2 7s ease-in-out infinite alternate}.float-node-3{animation:float3 5s ease-in-out infinite alternate}.glow-ring{animation:rotateRing 20s linear infinite;transform-origin:1050px 160px}.badge-glow{animation:badgePulse 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g opacity=".4"><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1"