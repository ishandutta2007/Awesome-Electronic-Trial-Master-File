<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic CSS Animations -->
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: wave 8s ease-in-out infinite alternate;
      }
      .float-node-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .float-node-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .float-node-3 {
        animation: float3 5s ease-in-out infinite alternate;
      }
      .glow-ring {
        animation: rotateRing 20s linear infinite;
        transform-origin: 1050px 160px;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.25; }
        100% { transform: scale(1.15); opacity: 0.55; }
      }
      @keyframes float1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(15px, -20px); }
      }
      @keyframes float2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-20px, 15px); }
      }
      @keyframes float3 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(10px, 25px); }
      }
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes badgePulse {
        0% { opacity: 0.7; }
        100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.8)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Dynamic Graphic Elements (Behind Text) -->
  <g opacity="0.4">
    <!-- Grid Overlay -->
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

    <!-- Pulsing Background Circles -->
    <circle cx="1050" cy="160" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" class="pulse-circle" opacity="0.3" />
    <circle cx="1050" cy="160" r="90" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" class="glow-ring" stroke-dasharray="8 12" />

    <!-- Animated Floating Network Nodes -->
    <g class="float-node-1">
      <circle cx="950" cy="80" r="6" fill="#00f2fe" filter="url(#softGlow)" />
      <line x1="950" y1="80" x2="1050" y2="160" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1.5" />
    </g>
    <g class="float-node-2">
      <circle cx="1120" cy="240" r="8" fill="#4facfe" filter="url(#softGlow)" />
      <line x1="1120" y1="240" x2="1050" y2="160" stroke="#4facfe" stroke-opacity="0.25" stroke-width="1.5" />
    </g>
    <g class="float-node-3">
      <circle cx="1140" cy="90" r="5" fill="#ff0080" filter="url(#softGlow)" />
      <line x1="1140" y1="90" x2="1050" y2="160" stroke="#ff0080" stroke-opacity="0.2" stroke-width="1.5" />
    </g>

    <!-- Subtle Wave Graphic at Bottom -->
    <path d="M 0 280 Q 300 240 600 280 T 1200 270 L 1200 320 L 0 320 Z" fill="url(#accentGrad)" opacity="0.06" class="wave-line" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast above dynamic elements) -->
  
  <!-- Category Pill / Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" class="badge-glow" />
    <text x="140" y="21" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
      CLINICAL TRIAL ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome eTMF Solutions 📁
  </text>

  <!-- Subtitle -->
  <text x="60" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    Electronic Trial Master File Platforms, GxP Document Systems &amp; Open-Source Architecture
  </text>

  <!-- Feature / Standard Tags -->
  <g transform="translate(60, 215)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="80" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      🛡️ 21 CFR Part 11
    </text>

    <!-- Tag 2 -->
    <rect x="172" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="247" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      📜 ICH GCP E6(R2)
    </text>

    <!-- Tag 3 -->
    <rect x="334" y="0" width="190" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="429" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      📊 TMF Reference Model
    </text>

    <!-- Tag 4 -->
    <rect x="536" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="621" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      ⚡ Inspection Readiness
    </text>
  </g>
</svg>
